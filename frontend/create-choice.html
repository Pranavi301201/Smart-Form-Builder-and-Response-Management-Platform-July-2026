<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Form</title>

<link rel="stylesheet" href="css/create-choice.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="choice-container">

<h1>Create New Form</h1>

<p>Select how you want to begin.</p>

<div class="cards">

<div class="choice-card" onclick="createScratch()">

<div class="icon">📝</div>

<h2>From Scratch</h2>

<p>Create your own custom form with full flexibility.</p>

<button>Create</button>

</div>

<div class="choice-card" onclick="useTemplate()">

<div class="icon">📋</div>

<h2>Use Template</h2>

<p>Start quickly using ready-made templates.</p>

<button>Browse</button>

</div>

</div>

</div>

<script src="js/create-choice.js"></script>

</body>
